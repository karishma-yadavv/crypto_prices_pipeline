# =====================================================================
# Crypto Prices Pipeline: Airflow + Postgres (Docker)
#
# Services:
#   airflow-db        -> Airflow ka apna database (metadata)
#   data-db           -> TUMHARA database (crypto_prices table yahan banegi)
#   airflow-init      -> ek baar chalta hai: Airflow DB setup + admin user
#   airflow-webserver -> UI (http://localhost:8081)
#   airflow-scheduler -> DAG ko har 5 minute mein chalata hai
#
# Ports 8081 aur 5434 isliye rakhe hain ki puraana project (8080, 5433)
# saath mein chal sake bina takraye.
# =====================================================================

name: airflow-crypto-pipeline

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-crypto-secret-key"
    # DAG mein postgres_conn_id="my_postgres" isi Connection ko use karta hai.
    # Host = "data-db" (docker service ka naam, localhost nahi)
    AIRFLOW_CONN_MY_POSTGRES: postgresql://myuser:mypass@data-db:5432/mydata
  volumes:
    - ./dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    data-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  data-db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydata
    ports:
      - "5434:5432"   # DBeaver/pgAdmin se connect karna ho: localhost:5434
    volumes:
      - data-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "myuser", "-d", "mydata"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        (airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin
        --email admin@example.com || true)

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      data-db:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      data-db:
        condition: service_healthy

volumes:
  airflow-db-data:
  data-db-data:
  airflow-logs:
